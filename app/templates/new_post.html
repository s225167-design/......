{% extends "base.html" %}

{% block title %}发布帖子 - 论坛 V5{% endblock %}

{% block content %}
<div class="new-post-container">
    <h2>✏️ 发布新帖子</h2>
    <form id="newPostForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label for="postTitle">标题</label>
            <input type="text" id="postTitle" placeholder="请输入标题" required maxlength="100">
        </div>
        <div class="form-group">
            <label for="postContent">内容</label>
            <textarea id="postContent" placeholder="请输入内容..." rows="10" required></textarea>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="window.history.back()">取消</button>
            <button type="submit" class="btn btn-primary">发布</button>
        </div>
    </form>
</div>

<script>
    async function handleSubmit(event) {
        event.preventDefault();

        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const token = localStorage.getItem('token');

        if (!token) {
            alert('请先登录');
            window.location.href = '/login';
            return;
        }

        if (!title || !content) {
            alert('请填写完整信息');
            return;
        }

        try {
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ title, content })
            });

            const data = await res.json();
            if (data.error) {
                alert(data.error);
                return;
            }

            window.location.href = `/post/${data.id}`;

        } catch (error) {
            alert('发布失败: ' + error.message);
        }
    }
</script>
{% endblock %}
