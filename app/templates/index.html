{% extends "base.html" %}

{% block title %}首页 - 论坛 V5{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📬 最新帖子</h1>
    <a href="/new-post" class="btn btn-primary">✏️ 发布新帖</a>
</div>

<div id="postsContainer" class="posts-list">
    <div class="loading">⏳ 加载中...</div>
</div>

<div class="pagination" id="pagination"></div>

<script>
    async function loadPosts(page = 1) {
        try {
            const res = await fetch(`/api/posts?page=${page}&per_page=20`);
            const data = await res.json();

            if (data.data && data.data.length === 0) {
                document.getElementById('postsContainer').innerHTML = `
                    <div class="empty-state">
                        <p>📭 还没有帖子</p>
                        <a href="/new-post" class="btn btn-primary">发布第一个帖子</a>
                    </div>
                `;
                return;
            }

            let html = '';
            data.data.forEach(post => {
                html += `
                    <div class="post-card" onclick="location.href='/post/${post.id}'">
                        <h3 class="post-title">${escapeHtml(post.title)}</h3>
                        <div class="post-meta">
                            <span>👤 ${escapeHtml(post.username || '匿名')}</span>
                            <span>📅 ${formatTime(post.created_at)}</span>
                            <span>💬 ${post.reply_count || 0} 回复</span>
                            ${post.is_pinned ? '<span class="badge-pinned">📌 置顶</span>' : ''}
                        </div>
                        <p class="post-preview">${escapeHtml(post.content).substring(0, 200)}${post.content.length > 200 ? '...' : ''}</p>
                    </div>
                `;
            });

            document.getElementById('postsContainer').innerHTML = html;

            const pagination = document.getElementById('pagination');
            const totalPages = data.pagination.pages;
            if (totalPages > 1) {
                let pagesHtml = '';
                for (let i = 1; i <= totalPages; i++) {
                    pagesHtml += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadPosts(${i})">${i}</button>`;
                }
                pagination.innerHTML = pagesHtml;
            } else {
                pagination.innerHTML = '';
            }

        } catch (error) {
            document.getElementById('postsContainer').innerHTML = `
                <div class="error-state">❌ 加载失败: ${error.message}</div>
            `;
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    document.addEventListener('DOMContentLoaded', () => loadPosts());
</script>
{% endblock %}
