{% extends "base.html" %}

{% block title %}管理后台 - 论坛 V5{% endblock %}

{% block content %}
<div class="admin-container">
    <h2>⚙️ 管理后台</h2>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <h3>📊 统计信息</h3>
            <div id="statsData">加载中...</div>
        </div>
    </div>

    <div class="admin-section">
        <h3>📋 所有帖子</h3>
        <div id="adminPosts" class="posts-list"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!user.is_admin) {
            window.location.href = '/';
            return;
        }

        try {
            const res = await fetch('/api/admin/stats', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const stats = await res.json();

            document.getElementById('statsData').innerHTML = `
                <p>📝 帖子: <strong>${stats.total_posts}</strong></p>
                <p>💬 回复: <strong>${stats.total_replies}</strong></p>
                <p>👤 用户: <strong>${stats.total_users}</strong></p>
            `;
        } catch (error) {
            document.getElementById('statsData').textContent = '加载失败';
        }
    });
</script>
{% endblock %}
